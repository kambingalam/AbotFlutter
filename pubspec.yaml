name: abot_drivers
description: "ABOT Driver App — driver companion untuk ABOT device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # BLE
  flutter_blue_plus: ^1.32.0
  permission_handler: ^11.3.1

  # GPS
  geolocator: ^12.0.0

  # Network
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Peta
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Tile cache offline
  flutter_map_tile_caching: ^9.0.1

  # Storage
  shared_preferences: ^2.2.3

  # TTS
  flutter_tts: ^4.0.2

  # Speech to text (voice search)
  speech_to_text: ^7.0.0

  # Wakelock (keep screen on)
  wakelock_plus: ^1.2.8

  # Foreground service (background mode)
  flutter_foreground_task: 8.13.0

  # Utils
  intl: ^0.19.0

  # Peta offline berbasis MBTiles
  flutter_map_mbtiles: ^1.0.4
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  audio_session: ^0.1.21
  mqtt_client: ^10.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true